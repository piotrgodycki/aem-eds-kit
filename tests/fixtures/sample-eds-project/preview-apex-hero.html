<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview apex-hero (responsive)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #1f1f1f; color: #eaeaea;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }

    /* Chrome is deliberately neutral/grayscale so it never tints the
       perception of the design being previewed. The only colour on screen
       should come from the block itself. */
    .bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 12px 18px; font-size: 13px;
      background: #141414; border-bottom: 1px solid #333;
    }
    .bar .label { margin-right: 4px; color: #8a8a8a; font-weight: 600; letter-spacing: .02em; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      cursor: pointer; border: 1px solid #3a3a3a; background: #232323; color: #cfcfcf;
      padding: 7px 13px; border-radius: 8px; font: inherit; font-size: 12.5px; font-weight: 600;
      transition: border-color .15s, background .15s, color .15s;
    }
    .btn svg { width: 15px; height: 15px; flex: 0 0 15px; }
    .btn:hover:not(.active) { border-color: #6a6a6a; background: #2e2e2e; color: #fff; }
    .btn:focus-visible { outline: 2px solid #8a8a8a; outline-offset: 2px; }
    /* Active: inverted neutral chip — clearly selected, still colourless. */
    .btn.active { background: #e6e6e6; border-color: #e6e6e6; color: #1a1a1a; }
    .btn.active:hover { background: #f2f2f2; }

    .meta { margin-left: auto; display: flex; gap: 14px; align-items: center; }
    .meta .showing { color: #8a8a8a; font-weight: 600; }
    .meta .showing b { color: #e6e6e6; }

    /* Status badge (pill) — neutral; meaning carried by the symbol, not colour. */
    .note { font-size: 11.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
      white-space: nowrap; color: #bdbdbd; background: #262626; border: 1px solid #3a3a3a; }

    .stage { padding: 30px 28px; display: flex; justify-content: center; overflow-x: auto; }
    .device {
      position: relative; background: #fff; border: 1px solid #000; transition: width .2s ease;
    }
    .device::before {
      content: attr(data-w) "px"; position: absolute; top: -20px; left: 0;
      font-size: 11px; color: #8a8a8a; font-family: ui-monospace, Menlo, monospace;
    }
    iframe { display: block; width: 100%; height: 820px; border: 0; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="label">Breakpoint</span>

    <button class="btn" data-w="375">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      375 mobile
    </button>

    <button class="btn" data-w="768">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      768 tablet
    </button>

    <button class="btn active" data-w="1280">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      1280 desktop (Figma 1:1)
    </button>

    <button class="btn" data-w="full">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 9 4 4 9 4"/><polyline points="20 9 20 4 15 4"/><polyline points="4 15 4 20 9 20"/><polyline points="20 15 20 20 15 20"/></svg>
      Full cała szerokość
    </button>

    <div class="meta">
      <span class="showing">Showing: <b id="cur">1280px</b></span>
      <span class="note" id="note"></span>
    </div>
  </div>

  <div class="stage">
    <div class="device" id="device" data-w="1280" style="width:1280px">
      <iframe id="frame" src="./preview-apex-hero-frame.html" title="apex-hero preview"></iframe>
    </div>
  </div>

  <script>
    const device = document.getElementById('device');
    const cur = document.getElementById('cur');
    const note = document.getElementById('note');
    const buttons = [...document.querySelectorAll('.btn')];

    // Which widths have a Figma reference (pixel-perfect) vs. are inferred.
    const REFERENCE = { 375: false, 768: false, 1280: true };

    function setWidth(w) {
      if (w === 'full') {
        device.style.width = '100%';
        device.dataset.w = Math.round(device.getBoundingClientRect().width);
        cur.textContent = device.dataset.w + 'px (full)';
        note.textContent = '↔ full-bleed, content centered & capped';
      } else {
        device.style.width = w + 'px';
        device.dataset.w = w;
        cur.textContent = w + 'px';
        note.textContent = REFERENCE[w]
          ? '✓ Figma reference, pixel-perfect 1:1'
          : '⚠ inferred, no Figma frame at this width';
      }
      buttons.forEach((b) => b.classList.toggle('active', b.dataset.w === String(w)));
    }

    buttons.forEach((b) => {
      const v = b.dataset.w === 'full' ? 'full' : Number(b.dataset.w);
      b.addEventListener('click', () => setWidth(v));
    });
    setWidth(1280);
  </script>
</body>
</html>
