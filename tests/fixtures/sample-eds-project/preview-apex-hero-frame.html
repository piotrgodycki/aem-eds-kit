<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Inner frame: renders ONLY the block. Loaded inside an <iframe> whose
       width is the chosen breakpoint, so the block's media queries fire
       against that width (not the real monitor width). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./blocks/apex-hero/apex-hero.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <!-- Authored content exactly as EDS hands it to decorate(): block > div(row) > div(cell) > content -->
  <div class="apex-hero block">
    <div>
      <div>
        <p>EST. 2026 INDUSTRIAL SERIES</p>
        <h1>REACH NEW HEIGHTS</h1>
        <p>Precision engineered for architectural professionals and industrial masters. Experience the structural integrity of aerospace-grade materials.</p>
        <p><a href="#explore">EXPLORE SERIES</a></p>
        <p><a href="#data">TECHNICAL DATA</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    import decorate from './blocks/apex-hero/apex-hero.js';
    decorate(document.querySelector('.apex-hero'));
  </script>
</body>
</html>
