<svg width="1440" height="709" viewBox="0 0 1440 709" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- aem-eds-kit sample design: the "hero" frame of the project's example file.
       The same block as examples/figma-kit (the Figma file its plugin builds) and
       site/example/ (its HTML twin, https://piotrgodycki.github.io/aem-eds-kit/example/):
       same copy, tokens and 1440px geometry. Bundled so the sample flag of
       eds block from-design works offline (no Figma token, no MCP).
       Real <text> nodes and role-named groups, so the agent reads copy and roles.
       Variant: Layout=split, Theme=dark. -->
  <g id="hero">
    <rect id="background" width="1440" height="709" fill="#0D0D0C"/>

    <g id="hero-content">
      <text id="eyebrow" x="120" y="168" font-family="Geist Mono, ui-monospace, monospace" font-size="13" font-weight="500" fill="#FF5A36">CLI for AEM Edge Delivery Services</text>

      <g id="headline" font-family="Geist, system-ui, sans-serif" font-size="72" font-weight="600" letter-spacing="-3.24" fill="#ECEBE6">
        <text x="118" y="236">Design frame in.</text>
        <text x="118" y="308">EDS block out.</text>
      </g>

      <g id="description" font-family="Geist, system-ui, sans-serif" font-size="19" font-weight="400" fill="#9A9890">
        <text x="120" y="381">Paste a design link - a Figma URL, or a Framer / Stitch page.</text>
        <text x="120" y="410">Figma is read via MCP/REST; Framer and Stitch are scraped</text>
        <text x="120" y="440">with headless Chromium. Your AI agent writes the block - JS,</text>
        <text x="120" y="469">CSS and a Universal Editor model - straight into your repo.</text>
      </g>

      <g id="cta-group" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600">
        <g id="button-primary">
          <rect x="120" y="507" width="147" height="48" rx="12" fill="#FF5A36"/>
          <text x="193.5" y="536" text-anchor="middle" fill="#0D0D0C">Install the CLI</text>
        </g>
        <g id="button-secondary">
          <rect x="279.5" y="507.5" width="152" height="47" rx="12" stroke="#ECEBE6"/>
          <text x="355.5" y="536" text-anchor="middle" fill="#ECEBE6">Read the docs</text>
        </g>
      </g>
    </g>

    <!-- hero-image: 560x517, radius 20. Decorative illustration (design frame,
         model, JS and CSS layers stacked above the rendered page); authors
         supply the real image. -->
    <g id="hero-image">
      <rect x="760" y="96" width="560" height="517" rx="20" fill="#0D0D0C"/>
      <path d="M840 470 L1040 560 L1240 470 L1040 380 Z" fill="#ECEBE6"/>
      <path d="M840 430 L1040 520 L1240 430 L1040 340 Z" fill="#1F1F1C" stroke="#2A2A27"/>
      <path d="M840 390 L1040 480 L1240 390 L1040 300 Z" fill="#1F1F1C" stroke="#2A2A27"/>
      <path d="M840 350 L1040 440 L1240 350 L1040 260 Z" fill="#1F1F1C" stroke="#2A2A27"/>
      <path d="M840 300 L1040 390 L1240 300 L1040 210 Z" fill="#161614" stroke="#FF5A36" stroke-width="2"/>
      <path d="M900 300 L1040 363 L1180 300 L1040 237 Z" stroke="#FF5A36" stroke-opacity="0.5"/>
    </g>
  </g>
</svg>
