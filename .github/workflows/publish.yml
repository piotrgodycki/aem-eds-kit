name: Publish

# Publishes on every GitHub Release (tag vX.Y.Z) to two registries:
#  1. npmjs.org  - public `aem-eds-kit` via OIDC Trusted Publishing (no token),
#     with provenance. Configure the trusted publisher on npmjs.com:
#       repo: piotrgodycki/aem-eds-kit · workflow: publish.yml · Allow npm publish.
#  2. GitHub Packages - scoped `@piotrgodycki/aem-eds-kit`, so the package shows
#     under your GitHub profile → Packages and links to this repo. Uses the
#     built-in GITHUB_TOKEN (no PAT needed).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # recent npm for OIDC support
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish to npmjs (skip if this version already exists)
        run: |
          if npm publish --provenance --access public 2>publish.log; then
            cat publish.log
          elif grep -qiE "cannot publish over|E409|previously published|already exists" publish.log; then
            echo "::notice::Version already on npmjs, skipping"; cat publish.log
          else
            cat publish.log; exit 1
          fi

  publish-github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish to GitHub Packages with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@piotrgodycki"
      - run: npm ci
      - run: npm run build
      # GitHub Packages requires the name scoped to the repo owner. Rename at
      # publish time only - package.json stays `aem-eds-kit` for npmjs.org.
      - run: npm pkg set name=@piotrgodycki/aem-eds-kit
      - name: Publish to GitHub Packages (skip if this version already exists)
        run: |
          if npm publish 2>publish.log; then
            cat publish.log
          elif grep -qiE "cannot publish over|E409|already exists" publish.log; then
            echo "::notice::Version already on GitHub Packages, skipping"; cat publish.log
          else
            cat publish.log; exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
