name: CI
run-name: "CI: ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Docs gate (CHANGELOG / README / site updated with the change)
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/check-docs.mjs origin/${{ github.base_ref }}
      - run: npm run lint
      - name: Dead code (knip)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run knip
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
