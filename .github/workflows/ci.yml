name: CI
run-name: "CI: ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 22
          # Runs the agent sandbox for real (sandbox-exec), see tests/lib/agent-sandbox.test.ts.
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # the version comes from package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: bubblewrap, for the agent sandbox test
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq bubblewrap
      - name: Docs gate (CHANGELOG / README / site updated with the change)
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/check-docs.mjs origin/${{ github.base_ref }}
      - run: pnpm run lint
      - name: Dead code (knip)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm run knip
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
