name: Deploy landing to GitHub Pages
run-name: "Pages: ${{ github.event.head_commit.message || github.ref_name }}"

# Publishes the marketing landing in `site/` to GitHub Pages.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    # Only redeploy when the site actually changes - so unrelated src/ pushes
    # don't cancel/restart the Pages deploy (concurrency cancels in-progress runs).
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "scripts/site-changelog.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # site/changelog.html is generated from CHANGELOG.md so the two can't drift.
      - run: node scripts/site-changelog.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
